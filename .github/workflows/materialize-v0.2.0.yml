name: Materialize DataFlow Platform v0.2.0

on:
  push:
    branches:
      - agent/data-dictionary-metadata-v0.2.0-20260726

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and validate release payload
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dataflow-platform-v0.2.0.tar.xz"
          cat .release/payload.part* | base64 --decode > "$archive"
          sha256sum "$archive"
          tar -tJf "$archive" >/dev/null
      - name: Materialize repository tree and push
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dataflow-platform-v0.2.0.tar.xz"
          stage="$RUNNER_TEMP/dataflow-platform-v0.2.0"
          mkdir -p "$stage"
          tar -xJf "$archive" -C "$stage"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$stage/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement data dictionary and metadata pipeline v0.2.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
