name: R pipeline checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          Rscript scripts/bootstrap.R --ci --with-optional > bootstrap.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cat bootstrap.log
          fi
          exit "$status"
      - name: Run tests
        shell: bash
        run: |
          set +e
          Rscript scripts/run_tests.R > test-results.log 2>&1
          status=$?
          cat test-results.log
          exit "$status"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-test-log-${{ github.run_id }}
          path: test-results.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Run example pipeline
        run: Rscript scripts/run_pipeline.R --pipeline data_dictionary --input examples/data --output outputs/ci --overwrite true
