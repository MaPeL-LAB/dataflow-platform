name: R pipeline checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  materialize_dataflow_v020:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/data-dictionary-metadata-v0.2.0-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reassemble and verify release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .release/payload.part* | base64 --decode > "$RUNNER_TEMP/dataflow-platform-v0.2.0.tar.xz"
          echo "d5915267831e8956a51b30b39df3c2f1fc6ac2b6c9b1db59180428f8bfd4d45b  $RUNNER_TEMP/dataflow-platform-v0.2.0.tar.xz" | sha256sum -c -
      - name: Materialize normal repository tree
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dataflow-platform-v0.2.0"
          mkdir -p "$stage"
          tar -xJf "$RUNNER_TEMP/dataflow-platform-v0.2.0.tar.xz" -C "$stage"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$stage/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement data dictionary and metadata pipeline v0.2.0"
          git push origin "HEAD:${{ github.head_ref }}"

  test:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/data-dictionary-metadata-v0.2.0-20260726'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript scripts/bootstrap.R
      - name: Run tests
        run: Rscript scripts/run_tests.R
      - name: Run example pipeline
        run: Rscript scripts/run_data_dictionary.R --input examples/data --output outputs/ci --max-categorical-levels 10
